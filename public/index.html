<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login to BuddyStore</title>
  <link rel="icon" type="image/x-icon" href="images/logo.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Poppins:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/enhanced-style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/enhanced-effects.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(45deg, rgba(0, 122, 255, 0.1) 0%, rgba(102, 126, 234, 0.1) 100%);
      backdrop-filter: blur(10px);
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .login-box {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      padding: 2.5rem;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1), 0 0 0 1px rgba(255, 255, 255, 0.2);
      text-align: center;
      width: 90%;
      max-width: 400px;
      position: relative;
      z-index: 1;
      border: 1px solid rgba(255, 255, 255, 0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .login-box:hover {
      transform: translateY(-5px);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(255, 255, 255, 0.3);
    }

    .login-box h2 {
      margin-bottom: 2rem;
      font-size: 43px;
      font-weight: 800;
      background: linear-gradient(135deg, #0066ff, #00c6ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.5px;
      line-height: 1.2;
      text-align: center;
      font-family: 'Inter', sans-serif;
      position: relative;
    }

    .telegram-login {
      display: inline-block;
      transition: all 0.3s ease;
      position: relative;
    }

    .telegram-login:hover {
      transform: scale(1.05);
      filter: drop-shadow(0 8px 20px rgba(0, 122, 255, 0.3));
    }

    .telegram-login::before {
      content: '';
      position: absolute;
      top: -5px;
      left: -5px;
      right: -5px;
      bottom: -5px;
      background: linear-gradient(45deg, #007aff, #00c6ff, #007aff);
      background-size: 200% 200%;
      border-radius: 12px;
      z-index: -1;
      opacity: 0;
      transition: opacity 0.3s ease;
      animation: gradientShift 3s ease infinite;
    }

    .telegram-login:hover::before {
      opacity: 0.3;
    }

    @media (max-width: 400px) {
      .login-box {
        padding: 2rem 1.5rem;
      }

      .login-box h2 {
        font-size: 32px;
        letter-spacing: 0.3px;
      }
    }

    .features-list {
      margin-top: 2rem;
      text-align: left;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 0.8rem;
      color: #555;
      font-size: 0.9rem;
      padding: 0.5rem;
      border-radius: 12px;
      transition: all 0.3s ease;
    }

    .feature-item:hover {
      background: rgba(0, 122, 255, 0.05);
      transform: translateX(5px);
    }

    .feature-icon {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #0066ff, #00c6ff);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(0, 102, 255, 0.3);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .feature-icon::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transform: rotate(45deg);
      transition: transform 0.6s ease;
    }

    .feature-item:hover .feature-icon {
      transform: scale(1.1) rotate(5deg);
      box-shadow: 0 6px 20px rgba(0, 102, 255, 0.4);
    }

    .feature-item:hover .feature-icon::before {
      transform: rotate(45deg) translateX(100%);
    }

    /* Enhanced particles - now handled by enhanced-effects.css and enhanced-interactions.js */
    
  </style>
</head>
<body>
  <!-- Enhanced particles container - particles will be generated by JavaScript -->
  <div class="particles"></div>
  <div class="login-box">
    <h2>Login to BuddyStore</h2>
    
    <script async src="https://telegram.org/js/telegram-widget.js?7"
      data-telegram-login="BuddyStoreBot" 
      data-size="large"
      data-userpic="true"
      data-auth-url="https://buddystore.duckdns.org/auth/telegram"
      data-request-access="write">
    </script>
  

  <div class="features-list">
        <div class="feature-item">
          <div class="feature-icon">✓</div>
          <span>Secure Telegram authentication</span>
        </div>
        <div class="feature-item">
          <div class="feature-icon">✓</div>
          <span>Instant video delivery</span>
        </div>
        <div class="feature-item">
          <div class="feature-icon">✓</div>
          <span>Premium content packages</span>
        </div>
        <div class="feature-item">
          <div class="feature-icon">✓</div>
          <span>24/7 customer support</span>
        </div>
        </div>

        </div>

  <!-- Enhanced Animations Script -->
  <script src="js/twemoji-loader.js"></script>
  <script src="js/page-transitions.js"></script>
  <script src="js/enhanced-interactions.js"></script>

</body>
</html>
